name: weather-paper-trade
# Hourly PAPER trading run for weather_bot daily-low strategy (no real orders; public data only).
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: weather-paper-trade
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/weather-trading-article-or21fj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r weather_bot/requirements.txt
      - name: Paper trade (daily lows, evening window)
        working-directory: weather_bot
        run: python paper_lows.py
      - name: Commit ledger
        run: |
          git config user.name "weather-paper-bot"
          git config user.email "weather-paper-bot@users.noreply.github.com"
          git add weather_bot/paper_lows
          git diff --cached --quiet || git commit -m "paper: run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
